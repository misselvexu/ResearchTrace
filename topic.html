function tabPanel(t){
  if (t==="overview") return overviewPanel();

  if (t==="evidence") return evidencePanel();

              ${e.saved?`<span class="pill pill-red" style="font-size:9px;">${tk('topic.evi.yourNote')}</span>`:''}
            </div>
            <div class="font-serif" style="font-size:18px;font-weight:600;margin-bottom:4px;">${title}</div>
            <div class="kicker" style="font-style:italic;font-family:var(--font-serif);font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-secondary);margin-bottom:12px;">${source} · ${e.page}</div>
            <blockquote style="font-family:var(--font-serif);font-size:15.5px;line-height:1.7;color:var(--ink-primary);background:var(--bg-paper-warm);border-left:2px solid var(--divider-strong);padding:14px 18px;margin:0 0 14px;font-style:italic;">${e.excerpt}</blockquote>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <a href="ask.html?q=${encodeURIComponent(tk('topic.evi.expandPrefix')+e.n)}" class="pill">${tk('topic.evi.expand')}</a>
              <button class="pill" onclick="alert(tk('topic.evi.alert.openPdf')+'${e.page}'+tk('topic.evi.alert.openPdfTail'))">${tk('topic.evi.openPdf')}</button>
              <button class="pill" onclick="alert(tk('topic.evi.alert.savedCard'))">${tk('topic.evi.saveCard')}</button>
              <a href="ask.html?q=${encodeURIComponent(tk('topic.evi.contraPrefix')+e.n+tk('topic.evi.contraSuffix'))}" class="pill">${tk('topic.evi.findContra')}</a>
            </div>
          </div>
        </div>
      </article>`;
    }).join("")}
  </div>`;
}

/* ============ RADAR ============ */
function radarPanel(){
  const events = [
    {k:"e1", t:"alert", level:"HIGH"},
    {k:"e2", t:"alert", level:"HIGH"},
    {k:"e3", t:"scan"},
    {k:"e4", t:"alert", level:"MEDIUM"},
    {k:"e5", t:"scan"},
    {k:"e6", t:"scan"},
  ];
  return `
  <div style="display:grid;grid-template-columns:1fr 320px;gap:36px;">
    <div>
      <h2 class="headline" style="font-size:26px;margin:0 0 8px;">${tk('topic.rd.title')}</h2>
      <p class="font-serif" style="font-style:italic;color:var(--ink-secondary);margin:0 0 26px;">${tk('topic.rd.lede')}</p>

      <div class="kicker-red" style="margin-bottom:14px;">${tk('topic.rd.recent')}</div>
      <div style="position:relative;padding-left:24px;border-left:1px dotted var(--divider-strong);">
        ${events.map(e=>{
          const date  = tk('topic.rd.'+e.k+'.date');
          const title = tk('topic.rd.'+e.k+'.t');
          const noteKey = 'topic.rd.'+e.k+'.note';
          const note  = (RTI18n.DICT[noteKey]) ? tk(noteKey) : '';
          return `
          <div style="position:relative;margin-bottom:18px;">
            <span style="position:absolute;left:-30px;top:6px;width:10px;height:10px;border-radius:50%;background:${e.t==='alert'?'var(--accent-red)':'var(--divider-strong)'};border:2px solid var(--bg-paper);"></span>
            <div class="kicker" style="margin-bottom:4px;">${date}${e.level?' · '+e.level:''}</div>
            <div class="font-serif" style="font-size:16px;font-weight:600;margin-bottom:2px;">${title}</div>
            ${note?`<div class="font-serif" style="font-style:italic;color:var(--ink-secondary);font-size:13.5px;">${note}</div>`:''}
          </div>`;
        }).join("")}
      </div>
    </div>

    <aside style="position:sticky;top:88px;align-self:start;">
      <div style="border:1px solid var(--divider);background:var(--bg-card);padding:18px;">
        <div class="kicker-red" style="margin-bottom:14px;">${tk('topic.rd.threshold')}</div>
        ${[1,2,3,4].map(i=>{
          const k = tk('topic.rd.t'+i+'.k');
          const v = tk('topic.rd.t'+i+'.v');
          const l = (i<=2) ? "HIGH" : "MEDIUM";
          return `
          <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--divider);">
            <div>
              <div style="font-size:13px">${k}</div>
              <div class="font-mono" style="font-size:11px;color:var(--accent-red);">${v}</div>
            </div>
            <span class="pill ${l==='HIGH'?'pill-red':''}" style="font-size:9px;">${l}</span>
          </div>`;
        }).join("")}
        <button class="btn btn-ghost" style="width:100%;margin-top:14px;justify-content:center;" onclick="alert(tk('topic.rd.alert.editTh'))">${tk('topic.rd.editTh')}</button>
      </div>

      <div style="border:1px solid var(--divider);background:var(--bg-paper-warm);padding:18px;margin-top:14px;">
        <div class="kicker-red" style="margin-bottom:10px;">${tk('topic.rd.coverage')}</div>
        <div style="font-family:var(--font-serif);font-size:38px;font-weight:700;color:var(--accent-red);line-height:1;">9</div>
        <div class="kicker" style="margin-top:4px;">${tk('topic.rd.daily')}</div>
        <button class="btn btn-red" style="width:100%;margin-top:14px;justify-content:center;" onclick="alert(tk('topic.rd.alert.addSrc'))">${tk('topic.rd.addSrc')}</button>
      </div>
    </aside>
  </div>`;
}

/* ============ BRIEFS ============ */
function briefsPanel(){
  const BRIEFS = [
    {k:"b1", n:"08", read:false, len:"11 min"},
    {k:"b2", n:"07", read:true,  len:"18 min"},
    {k:"b3", n:"06", read:true,  len:"24 min"},
    {k:"b4", n:"05", read:true,  len:"9 min"},
    {k:"b5", n:"04", read:true,  len:"10 min"},
    {k:"b6", n:"03", read:true,  len:"8 min"},
    {k:"b7", n:"02", read:true,  len:"6 min"},
    {k:"b8", n:"01", read:true,  len:"3 min"},
  ];
  return `
  <div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;">
      <h2 class="headline" style="font-size:26px;margin:0;">${tk('topic.br.title')}</h2>
      <button class="btn btn-red" onclick="alert(tk('topic.br.alert.gen'))">${tk('topic.br.btn.gen')}</button>
    </div>

    ${BRIEFS.map(b=>`
      <a href="brief.html?id=${b.n}" style="display:grid;grid-template-columns:60px 1fr 130px 80px 100px;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--divider);text-decoration:none;color:inherit;">
        <div class="font-serif" style="font-size:32px;font-weight:700;color:var(--accent-red);line-height:1;">${b.n}</div>
        <div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
            <span class="pill" style="font-size:9px;">${tk('topic.br.'+b.k+'.tag')}</span>
            ${b.read?'':`<span class="pill pill-red" style="font-size:9px;">${tk('topic.br.unread')}</span>`}
          </div>
          <div class="font-serif" style="font-size:18px;font-weight:600;line-height:1.3;">${tk('topic.br.'+b.k+'.t')}</div>
        </div>
        <div class="kicker">${tk('topic.br.'+b.k+'.date')}</div>
        <div class="font-mono" style="font-size:11px;color:var(--ink-tertiary);">${b.len}</div>
        <div style="text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--accent-red);letter-spacing:.1em;">${tk('topic.br.read')}</div>
      </a>
    `).join("")}
  </div>`;
}

/* render header + tabbed content */
function render(){
  document.getElementById("main").innerHTML = `
<section style="border-bottom:1px solid var(--divider);background:var(--bg-paper);">
  <div style="max-width:1280px;margin:0 auto;padding:32px 48px 0;">
    <div style="display:grid;grid-template-columns:1fr 200px;gap:32px;align-items:flex-end;">
      <div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
          <a href="topics.html" class="kicker" style="text-decoration:none;color:var(--ink-tertiary);">${tk('topic.allTopics')}</a>
          <span class="kicker">·</span>
          <span class="kicker-red">${tk('topic.no')}${T.n}</span>
        </div>
        <h1 class="headline" style="font-size:48px;margin:0 0 4px;">${T.name}</h1>
        <div class="font-serif" style="font-style:italic;color:var(--ink-secondary);font-size:17px;">${tk('topic.'+T.k+'.zh')}</div>
      </div>
      <div style="text-align:right;">
        <div class="watermark-number" style="font-size:120px;">${T.n}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(5,1fr) auto;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--divider);align-items:center;">
      ${[["topic.stat.items",T.items],["topic.stat.claims",T.claims],["topic.stat.evidence",T.evidence],["topic.stat.briefs",T.briefs],["topic.stat.sources",T.sourceCount]].map(([lk,n])=>`
        <div>
          <div class="font-serif" style="font-size:24px;font-weight:600;line-height:1;">${n}</div>
          <div class="kicker" style="font-size:10px;margin-top:2px;">${tk(lk)}</div>
        </div>
      `).join("")}
      <div style="display:flex;gap:6px;">
        <button class="pill pill-red" onclick="alert(tk('topic.alert.pin'))">${tk('topic.btn.pinned')}</button>
        <button class="pill" onclick="alert(tk('topic.alert.settings'))">${tk('topic.btn.settings')}</button>
      </div>
    </div>

    <nav class="tab-strip" style="margin-top:22px;">
      ${TABS.map(([id,labelK])=>`
        <a href="topic.html?t=${tid}&tab=${id}" class="${id===tab?'is-active':''}">
          <span>${TAB_EN[id]}</span>
          <span style="margin-left:6px;font-size:9px;color:var(--ink-tertiary);">${tk(labelK)}</span>
        </a>
      `).join("")}
    </nav>
  </div>
</section>

<section>
  <div style="max-width:1280px;margin:0 auto;padding:36px 48px 80px;">
    ${tabPanel(tab)}
  </div>
</section>
`;
}

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
