<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brief No. 127 — 研迹 ResearchTrace</title>
<script src="js/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="brief">
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script>
RT.mountShell({ activeId: "", crumbKey: "brief.crumb", crumb: RTI18n.t("brief.crumb") });
RT.autoApplyI18n();
const params = new URLSearchParams(location.search);
const id = params.get("id") || "127";

function render(){
  document.getElementById("main").innerHTML = `
<div style="max-width:880px;margin:0 auto;padding:48px 48px 80px;">

  <header style="border-bottom:3px double var(--divider-strong);padding-bottom:28px;margin-bottom:36px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;">
      <div style="flex:1;">
        <div class="kicker-red" style="margin-bottom:14px;">${tk('brief.kicker')} ${id}</div>
        <h1 class="headline" style="font-size:42px;margin:0 0 12px;line-height:1.15;">${tk('brief.title')}</h1>
        <p class="font-serif" style="font-style:italic;font-size:17px;color:var(--ink-secondary);margin:0;">${tk('brief.subtitle')}</p>
        <div style="display:flex;gap:16px;margin-top:18px;align-items:center;flex-wrap:wrap;">
          <span class="kicker">${tk('brief.delivered')}</span>
          <span class="kicker">·</span>
          <span class="kicker">${tk('brief.topic')}</span>
          <span class="kicker">·</span>
          <span class="kicker">${tk('brief.editor')}</span>
        </div>
      </div>
      <div style="text-align:right;margin-left:24px;">
        <div class="watermark-number" style="font-size:108px;">${id}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;">
      <button class="btn btn-red" onclick="alert(tk('brief.alert.save'))">${tk('brief.btn.save')}</button>
      <button class="btn btn-ghost" onclick="alert(tk('brief.alert.export'))">${tk('brief.btn.export')}</button>
      <button class="btn btn-ghost" onclick="alert(tk('brief.alert.share'))">${tk('brief.btn.share')}</button>
      <button class="btn btn-ghost" onclick="window.print()">${tk('brief.btn.print')}</button>
      <span style="flex:1"></span>
      <a href="briefs.html" class="font-mono" style="font-size:11px;color:var(--ink-tertiary);text-decoration:none;letter-spacing:.1em;align-self:center;">${tk('brief.btn.library')}</a>
    </div>
  </header>

  <section style="margin-bottom:36px;padding:20px 24px;background:var(--bg-paper-warm);border:1px solid var(--divider);">
    <div class="kicker-red" style="margin-bottom:12px;">${tk('brief.toc')}</div>
    ${[1,2,3,4,5,6].map((i)=>{
      const roman = ["I","II","III","IV","V","VI"][i-1];
      return `
      <a href="#sec-${i-1}" class="leader" style="text-decoration:none;color:var(--ink-primary);padding:5px 0;">
        <span class="font-mono" style="font-size:11px;color:var(--accent-red);">§ ${roman}</span>
        <span class="font-serif" style="font-size:14.5px;">${tk('brief.toc.'+i)}</span>
        <span class="dots"></span>
        <span class="font-mono" style="font-size:10px;color:var(--ink-tertiary);">P. ${i*2}</span>
      </a>`;
    }).join("")}
  </section>

  <section id="sec-0" style="margin-bottom:40px;">
    <div class="rule-kicker"><span class="kicker-red">${tk('brief.s1.kicker')}</span></div>
    <div class="callout-brief">
      <span class="label">${tk('brief.s1.label')}</span>
      ${tk('brief.s1.body.html')}
    </div>
  </section>

  <section id="sec-1" style="margin-bottom:40px;">
    <div class="rule-kicker"><span class="kicker-red">${tk('brief.s2.kicker')}</span></div>
    ${[
      {n:"01",tK:"brief.s2.h1.t",dK:"brief.s2.h1.d",href:"topic.html?t=llm-longctx&claim=rmt-v3"},
      {n:"02",tK:"brief.s2.h2.t",dK:"brief.s2.h2.d",href:"topic.html?t=llm-longctx&claim=claude-needle"},
      {n:"03",tK:"brief.s2.h3.t",dK:"brief.s2.h3.d",href:"topic.html?t=rag&item=graphrag"},
    ].map(s=>`
      <a href="${s.href}" style="display:grid;grid-template-columns:60px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--divider);text-decoration:none;color:inherit;">
        <div class="font-serif" style="font-size:32px;font-weight:700;color:var(--accent-red);line-height:1;">${s.n}</div>
        <div>
          <div class="font-serif" style="font-size:18px;font-weight:600;line-height:1.3;margin-bottom:4px;">${tk(s.tK)}</div>
          <div class="font-serif" style="font-style:italic;font-size:14.5px;color:var(--ink-secondary);">${tk(s.dK)}</div>
        </div>
      </a>`).join("")}
  </section>

  <section id="sec-2" style="margin-bottom:40px;">
    <div class="rule-kicker"><span class="kicker-red">${tk('brief.s3.kicker')}</span></div>
    <p class="font-serif dropcap" style="font-size:17px;line-height:1.85;">
      ${tk('brief.s3.p1.html')}
    </p>
    <p class="font-serif" style="font-size:17px;line-height:1.85;margin-top:14px;">
      ${tk('brief.s3.p2.html')}
    </p>

    <figure style="margin:30px 0;padding:20px;background:var(--bg-paper-warm);border:1px solid var(--divider);">
      <img src="assets/img/agents-diagram.png" alt="" style="width:100%;border:1px solid var(--divider);background:#fff"/>
      <figcaption class="font-serif" style="font-style:italic;font-size:13px;color:var(--ink-secondary);margin-top:10px;text-align:center;">${tk('brief.s3.fig')}</figcaption>
    </figure>
  </section>

  <section id="sec-3" style="margin-bottom:40px;">
    <div class="rule-kicker"><span class="kicker-red">${tk('brief.s4.kicker')}</span></div>
    <p class="font-serif" style="font-size:17px;line-height:1.85;">
      ${tk('brief.s4.p.html')}
    </p>
    <div style="margin-top:18px;padding:14px 18px;background:var(--bg-paper-warm);border-left:3px solid var(--success-green);">
      <div class="kicker" style="color:var(--success-green);margin-bottom:6px;">${tk('brief.s4.callout')}</div>
      <div class="font-serif" style="font-style:italic;font-size:15px;">${tk('brief.s4.callout.body')}</div>
    </div>
  </section>

  <section id="sec-4" style="margin-bottom:40px;">
    <div class="rule-kicker"><span class="kicker-red">${tk('brief.s5.kicker')}</span></div>
    <p class="font-serif" style="font-size:17px;line-height:1.85;">
      ${tk('brief.s5.p1.html')}
    </p>
    <p class="font-serif" style="font-size:17px;line-height:1.85;margin-top:12px;">
      ${tk('brief.s5.p2.html')}
    </p>
  </section>

  <section id="sec-5" style="margin-bottom:40px;">
    <div class="rule-kicker"><span class="kicker-red">${tk('brief.s6.kicker')}</span></div>
    <p class="font-serif" style="font-style:italic;font-size:15.5px;color:var(--ink-secondary);margin:0 0 14px;">${tk('brief.s6.intro')}</p>
    <ul style="font-family:var(--font-serif);font-size:16px;line-height:1.8;padding-left:22px;margin:0;">
      <li>${tk('brief.s6.l1')}</li>
      <li>${tk('brief.s6.l2')}</li>
      <li>${tk('brief.s6.l3')}</li>
      <li>${tk('brief.s6.l4')}</li>
    </ul>
  </section>

  <section style="border-top:3px double var(--divider-strong);padding-top:24px;margin-top:48px;">
    <div class="kicker-red" style="margin-bottom:14px;">${tk('brief.followups')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <a href="ask.html?q=${encodeURIComponent(tk('brief.fu.diagram.q'))}" class="pill pill-red">${tk('brief.fu.diagram')}</a>
      <a href="ask.html?q=${encodeURIComponent(tk('brief.fu.reproduce.q'))}" class="pill">${tk('brief.fu.reproduce')}</a>
      <a href="topic.html?t=llm-longctx&tab=evidence" class="pill">${tk('brief.fu.viewEvi')}</a>
      <a href="ask.html?q=${encodeURIComponent(tk('brief.fu.challenge.q'))}" class="pill">${tk('brief.fu.challenge')}</a>
      <button class="pill" onclick="alert(tk('brief.fu.alert.subscribe'))">${tk('brief.fu.subscribe')}</button>
    </div>
  </section>

  <footer style="margin-top:60px;padding-top:24px;border-top:1px solid var(--divider);display:flex;justify-content:space-between;align-items:flex-end;">
    <div>
      <div class="font-serif" style="font-style:italic;font-size:14px;color:var(--ink-secondary);">${tk('brief.colophon.tagline')}</div>
      <div class="kicker" style="margin-top:6px;">${tk('brief.colophon.byline')}</div>
    </div>
    <div style="text-align:right;">
      <div class="kicker">${tk('brief.prevnext')}</div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <a href="brief.html?id=126" class="pill">← No.126</a>
        <a href="briefs.html" class="pill">${tk('brief.btn.library2')}</a>
      </div>
    </div>
  </footer>
</div>
`;
}

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
