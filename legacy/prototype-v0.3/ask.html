<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask — 研迹 ResearchTrace</title>
<script src="js/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="ask">
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script>
RT.mountShell({ activeId: "ask", crumbKey: "ask.crumb", crumb: RTI18n.t("ask.crumb") });
RT.autoApplyI18n();

const params = new URLSearchParams(location.search);
const initialQ = params.get("q") || "";

const HISTORY = [
  {qK:"ask.h1", tK:"ask.h.t.justNow",   active:true},
  {qK:"ask.h2", tK:"ask.h.t.5min"},
  {qK:"ask.h3", tK:"ask.h.t.today09"},
  {qK:"ask.h4", tK:"ask.h.t.yesterday"},
  {qK:"ask.h5", tK:"ask.h.t.may7"},
  {qK:"ask.h6", tK:"ask.h.t.may5"},
  {qK:"ask.h7", tK:"ask.h.t.may3"},
];

const SOURCES = [
  {n:"1", title:"Recurrent Memory Transformer v3",          auth:"Bulatov et al., DeepMind 2025", venue:"arXiv 2505.04127 · §2.3", excerpt:"&hellip; we introduce a recurrent compression layer that summarizes past context into a fixed-length memory state, processed at <strong>linear complexity O(n)</strong> regardless of sequence length up to 2,097,152 tokens&hellip;", page:"p.4–7", thumb:"thumb-longctx.png"},
  {n:"2", title:"MemGPT: LLMs as Operating Systems",        auth:"Packer et al. 2023",            venue:"arXiv 2310.08560 · §3.1", excerpt:"&hellip; MemGPT manages an explicit two-tier memory hierarchy (main context + recall storage) with <strong>self-directed swap operations</strong>, akin to OS virtual memory&hellip;", page:"p.5",   thumb:"thumb-rag.png"},
  {n:"3", title:"LongMem: Augmented Memory for Frozen LLMs",auth:"Wang et al. 2024",              venue:"NeurIPS 2024 · §4",       excerpt:"&hellip; the SideNet acts as an external memory module, retrieving from a 65K-token bank via cross-attention, leaving the base LLM weights frozen&hellip;", page:"p.8",   thumb:"thumb-longctx.png", saved:true},
  {n:"4", title:"Lilian Weng — Why 200K May Not Be the Answer", auth:"lilianweng.github.io",      venueK:"ask.src.s4.venue",       excerpt:"&hellip; even when the context fits, attention dilution causes accuracy drops on multi-hop tasks. The promise of long-context is overstated for production&hellip;", page:"§ "},
];

const RELATED = [
  {tK:"ask.related.note"},
  {tK:"ask.related.streaming"},
  {tK:"ask.related.compare"},
];

function buildAnswer(){
  return `
  <p class="font-serif" style="font-size:17px;line-height:1.85;">
    ${tk('ask.answer.lede.html')}
  </p>

  <h3 class="font-serif" style="font-size:20px;font-weight:600;margin:24px 0 10px;">${tk('ask.answer.h1')}</h3>
  <p class="font-serif" style="font-size:17px;line-height:1.85;">
    ${tk('ask.answer.p1.html')}
  </p>

  <h3 class="font-serif" style="font-size:20px;font-weight:600;margin:24px 0 10px;">${tk('ask.answer.h2')}</h3>
  <ol style="font-family:var(--font-serif);font-size:17px;line-height:1.85;padding-left:22px;">
    <li>${tk('ask.answer.li1.html')}</li>
    <li>${tk('ask.answer.li2.html')}</li>
    <li>${tk('ask.answer.li3.html')}</li>
  </ol>

  <h3 class="font-serif" style="font-size:20px;font-weight:600;margin:24px 0 10px;">${tk('ask.answer.h3')}</h3>
  <p class="font-serif" style="font-size:17px;line-height:1.85;">
    ${tk('ask.answer.p2.html')}
  </p>

  <div style="margin-top:30px;padding:18px 22px;background:var(--bg-paper-warm);border-left:3px solid var(--accent-red);">
    <div class="kicker-red" style="margin-bottom:8px;">${tk('ask.answer.curatorTake')}</div>
    <p class="font-serif" style="font-style:italic;font-size:15.5px;line-height:1.65;margin:0;">
      ${tk('ask.answer.curator.html')}
    </p>
  </div>
  `;
}

function render(){
  document.getElementById("main").innerHTML = `
<div style="display:grid;grid-template-columns:260px 1fr 380px;height:calc(100vh - 56px);">

  <aside style="border-right:1px solid var(--divider);background:var(--bg-paper-warm);overflow-y:auto;">
    <div style="padding:18px 16px 12px;border-bottom:1px solid var(--divider);">
      <div class="kicker-red" style="margin-bottom:10px;">${tk('ask.history')}</div>
      <button class="btn btn-red" style="width:100%;justify-content:center;font-size:11px;" onclick="newAsk()">${tk('ask.newQuestion')}</button>
    </div>
    <div style="padding:10px 8px;">
      ${HISTORY.map((h,i)=>`
        <a href="#" onclick="event.preventDefault();selectHistory(${i})" class="${h.active?'is-active':''}" style="display:block;padding:10px 12px;text-decoration:none;color:var(--ink-primary);border-left:2px solid ${h.active?'var(--accent-red)':'transparent'};background:${h.active?'var(--bg-card)':'transparent'};margin-bottom:2px;">
          <div class="font-serif" style="font-size:13.5px;line-height:1.35;font-weight:${h.active?'600':'400'};">${tk(h.qK)}</div>
          <div class="kicker" style="font-size:9px;margin-top:4px;">${tk(h.tK)}</div>
        </a>
      `).join("")}
    </div>
  </aside>

  <section style="overflow-y:auto;padding:36px 44px 60px;background:var(--bg-paper);">
    <div class="kicker-red" style="margin-bottom:8px;">${tk('ask.meta')}</div>
    <h1 class="headline" style="font-size:30px;margin:0 0 24px;line-height:1.22;" id="qDisplay">${tk('ask.q.display')}</h1>

    <div style="display:flex;gap:24px;align-items:center;padding:14px 18px;background:var(--bg-card);border:1px solid var(--divider);margin-bottom:28px;">
      <div>
        <div class="kicker" style="font-size:9px;">${tk('ask.confidence')}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:2px;">
          <div class="confidence-track"><div class="confidence-fill" style="width:87%"></div></div>
          <span class="font-mono" style="font-size:13px;font-weight:600;">87%</span>
        </div>
      </div>
      <div style="height:32px;width:1px;background:var(--divider);"></div>
      <div>
        <div class="kicker" style="font-size:9px;">${tk('ask.retrieval')}</div>
        <div class="font-mono" style="font-size:11px;">BM25 ⊕ pgvector → Cohere rerank</div>
      </div>
      <div style="height:32px;width:1px;background:var(--divider);"></div>
      <div>
        <div class="kicker" style="font-size:9px;">${tk('ask.model')}</div>
        <div class="font-mono" style="font-size:11px;">Claude 3.5 Sonnet · via Portkey</div>
      </div>
      <div style="flex:1"></div>
      <button class="pill" onclick="alert(tk('ask.alert.trace'))">${tk('ask.showTrace')}</button>
    </div>

    <article id="answerBody">${buildAnswer()}</article>

    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:36px;padding-top:22px;border-top:1px solid var(--divider);">
      <span class="kicker" style="margin-right:8px;align-self:center;">${tk('ask.followup')}</span>
      <a href="ask.html?q=${encodeURIComponent(tk('ask.fu.diagram'))}" class="pill pill-red">${tk('ask.diagramIt')}</a>
      <a href="ask.html?q=${encodeURIComponent(tk('ask.fu.contradict'))}" class="pill">${tk('ask.contradictions')}</a>
      <a href="ask.html?q=${encodeURIComponent(tk('ask.fu.reproduce'))}" class="pill">${tk('ask.reproduce')}</a>
      <a href="ask.html?q=${encodeURIComponent(tk('ask.fu.missing'))}" class="pill">${tk('ask.missing')}</a>
      <button class="pill" onclick="alert(tk('common.savedAsCard'))">${tk('ask.saveCard')}</button>
      <button class="pill pill-solid" onclick="alert(tk('common.shareSuccess'))">${tk('ask.share')}</button>
    </div>

    <div style="margin-top:48px;padding:20px 22px;background:var(--bg-paper-warm);border:1px solid var(--divider);">
      <div class="kicker-red" style="margin-bottom:10px;">${tk('ask.followBox')}</div>
      <div style="display:flex;gap:10px;align-items:flex-start;">
        <input id="composer" type="text" placeholder="${tk('ask.composer')}" style="flex:1;padding:12px 14px;border:1px solid var(--divider);background:var(--bg-card);font-family:var(--font-serif);font-size:15px;color:var(--ink-primary);"/>
        <button class="btn btn-red" onclick="submitFollowup()">${tk('ask.send')}</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <span class="kicker" style="font-size:9px;align-self:center">${tk('ask.scope')}</span>
        <button class="pill is-active">${tk('ask.allTopics')}</button>
        <button class="pill">${tk('ask.thisTopic')}</button>
        <button class="pill">${tk('ask.savedItems')}</button>
        <button class="pill">${tk('ask.narrow')}</button>
      </div>
    </div>
  </section>

  <aside style="border-left:1px solid var(--divider);background:var(--bg-card);overflow-y:auto;">
    <div style="padding:18px 18px 12px;border-bottom:1px solid var(--divider);">
      <div class="kicker-red" style="margin-bottom:6px;">${tk('ask.sources')}${SOURCES.length}</div>
      <p class="font-serif" style="font-style:italic;font-size:13px;color:var(--ink-secondary);margin:0;">${tk('ask.sources.lede')}</p>
    </div>

    <div id="sourceList" style="padding:12px 14px;">
      ${SOURCES.map(s=>{
        const venue = s.venueK ? tk(s.venueK) : s.venue;
        return `
        <article id="src-${s.n}" class="paper-card source-card" style="padding:14px 16px;margin-bottom:10px;cursor:pointer;" onclick="openSource('${s.n}')">
          <div style="display:flex;gap:10px;align-items:flex-start;">
            <span class="cite" style="position:relative;top:2px;min-width:22px;height:22px;font-size:11px;">${s.n}</span>
            <div style="flex:1;min-width:0;">
              <div class="font-serif" style="font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px;">${s.title}</div>
              <div class="kicker" style="font-size:9px;margin-bottom:8px;">${s.auth} · ${venue}</div>
              <blockquote style="font-family:var(--font-serif);font-size:12.5px;font-style:italic;line-height:1.55;color:var(--ink-secondary);margin:0 0 8px;padding:6px 10px;border-left:2px solid var(--divider-strong);background:var(--bg-paper-warm);">${s.excerpt}</blockquote>
              <div style="display:flex;gap:5px;flex-wrap:wrap;">
                ${s.saved?`<span class="pill pill-red" style="font-size:9px;padding:1px 6px;">${tk('ask.pill.saved')}</span>`:''}
                <span class="pill" style="font-size:9px;padding:1px 6px;" onclick="event.stopPropagation();alert(tk('ask.alert.openPdf')+'${s.page}'+tk('ask.alert.openPdfTail'))">${s.page}</span>
                <span class="pill" style="font-size:9px;padding:1px 6px;" onclick="event.stopPropagation();window.location.href='topic.html?t=llm-longctx&tab=evidence'">${tk('ask.pill.seeAllEvi')}</span>
              </div>
            </div>
          </div>
        </article>`;
      }).join("")}
    </div>

    <div style="padding:14px 18px;border-top:1px solid var(--divider);background:var(--bg-paper-warm);">
      <div class="kicker-red" style="margin-bottom:8px;">${tk('ask.related')}</div>
      ${RELATED.map(r=>`<a href="#" onclick="event.preventDefault();alert(tk('ask.alert.openItem')+'${tk(r.tK).replace(/'/g,"\\'")}')" style="display:block;font-family:var(--font-serif);font-size:13px;font-style:italic;padding:6px 0;color:var(--ink-primary);text-decoration:none;border-bottom:1px dotted var(--divider);">${tk(r.tK)} →</a>`).join("")}
    </div>
  </aside>
</div>
`;

  if (initialQ) {
    document.getElementById("qDisplay").textContent = initialQ;
  }

  document.querySelectorAll('.cite').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const n = el.dataset.src || el.textContent.trim();
      openSource(n);
    });
  });

  document.getElementById('composer').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitFollowup();
  });
}

function openSource(n) {
  document.querySelectorAll('.source-card').forEach(c => c.style.borderColor = 'var(--divider)');
  const card = document.getElementById('src-' + n);
  if (card) {
    card.style.borderColor = 'var(--accent-red)';
    card.scrollIntoView({behavior:'smooth', block:'center'});
  }
}
function submitFollowup(){
  const v = document.getElementById('composer').value.trim();
  if (!v) return;
  window.location.href = 'ask.html?q=' + encodeURIComponent(v);
}
function newAsk(){ window.location.href='ask.html'; }
function selectHistory(i){ window.location.href='ask.html?q='+encodeURIComponent(tk(HISTORY[i].qK)); }

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
