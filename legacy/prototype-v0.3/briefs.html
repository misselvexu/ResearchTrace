<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Briefs — 研迹 ResearchTrace</title>
<script src="js/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="briefs">
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script>
RT.mountShell({ activeId: "briefs", crumbKey: "briefs.crumb", crumb: RTI18n.t("briefs.crumb") });
RT.autoApplyI18n();

const FEATURED = {
  n:"127", topicK:"briefs.t.long", img:"thumb-longctx.png", read:false, claims:7, evidence:23
};

const BRIEFS = [
  {n:"126", k:"b126", dateK:"briefs.d.yesterday", topicK:"briefs.t.agentic", img:"thumb-agentic.png", read:true, len:"9 min",  claims:5, evidence:18},
  {n:"125", k:"b125", dateK:"briefs.d.may7",      topicK:"briefs.t.long",    img:"thumb-longctx.png", read:true, len:"18 min", claims:8, evidence:34},
  {n:"124", k:"b124", dateK:"briefs.d.may5",      topicK:"briefs.t.eval",    img:"thumb-bench.png",   read:true, len:"22 min", claims:11,evidence:42},
  {n:"123", k:"b123", dateK:"briefs.d.may3",      topicK:"briefs.t.rag",     img:"thumb-rag.png",     read:true, len:"10 min", claims:6, evidence:21},
  {n:"122", k:"b122", dateK:"briefs.d.may1",      topicK:"briefs.t.pm",      img:"thumb-strategy.png",read:true, len:"24 min", claims:9, evidence:31},
  {n:"121", k:"b121", dateK:"briefs.d.apr29",     topicK:"briefs.t.align",   img:"thumb-align.png",   read:true, len:"7 min",  claims:4, evidence:15},
  {n:"120", k:"b120", dateK:"briefs.d.apr25",     topicK:"briefs.t.reason",  img:"thumb-bench.png",   read:true, len:"11 min", claims:6, evidence:19},
  {n:"119", k:"b119", dateK:"briefs.d.apr22",     topicK:"briefs.t.long",    img:"thumb-longctx.png", read:true, len:"13 min", claims:7, evidence:28},
  {n:"118", k:"b118", dateK:"briefs.d.apr18",     topicK:"briefs.t.long",    img:"thumb-bench.png",   read:true, len:"10 min", claims:5, evidence:17},
];

function render(){
  document.getElementById("main").innerHTML = `
<section style="border-bottom:1px solid var(--divider);">
  <div style="max-width:1280px;margin:0 auto;padding:36px 48px 22px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;">
      <div>
        <div class="kicker-red" style="margin-bottom:10px;">${tk('briefs.kicker')}</div>
        <h1 class="headline" style="font-size:46px;margin:0;">${tk('briefs.title')}</h1>
        <p class="font-serif" style="font-style:italic;color:var(--ink-secondary);margin:6px 0 0;max-width:680px;">
          ${tk('briefs.lede')}
        </p>
      </div>
      <div style="text-align:right;">
        <div class="watermark-number" style="font-size:96px;">36</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:6px;margin-top:24px;padding-top:18px;border-top:1px solid var(--divider);flex-wrap:wrap;">
      <span class="kicker">${tk('briefs.filter')}</span>
      <button class="pill is-active">${tk('briefs.f.all')}</button>
      <button class="pill">${tk('briefs.f.weekly')}</button>
      <button class="pill">${tk('briefs.f.monthly')}</button>
      <button class="pill">${tk('briefs.f.deepdive')}</button>
      <button class="pill">${tk('briefs.f.initial')}</button>
      <span style="margin:0 8px;color:var(--divider-strong)">|</span>
      <span class="kicker">${tk('briefs.byTopic')}</span>
      <button class="pill">${tk('briefs.bt.long')}</button>
      <button class="pill">${tk('briefs.bt.agentic')}</button>
      <button class="pill">${tk('briefs.bt.eval')}</button>
      <button class="pill">${tk('briefs.bt.rag')}</button>
      <button class="pill">${tk('briefs.bt.product')}</button>
      <span style="flex:1"></span>
      <button class="btn btn-red" onclick="alert(tk('briefs.alert.newBrief'))">${tk('briefs.btn.newBrief')}</button>
    </div>
  </div>
</section>

<section style="background:var(--bg-paper-warm);border-bottom:1px solid var(--divider);">
  <div style="max-width:1280px;margin:0 auto;padding:42px 48px;">
    <div class="kicker-red" style="margin-bottom:16px;">${tk('briefs.featured')}</div>
    <a href="brief.html?id=${FEATURED.n}" style="text-decoration:none;color:inherit;display:grid;grid-template-columns:380px 1fr;gap:36px;align-items:center;">
      <div style="position:relative;">
        <img src="assets/img/${FEATURED.img}" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--divider);"/>
        <span class="watermark-number" style="position:absolute;top:-20px;left:-16px;font-size:120px;">${FEATURED.n}</span>
        ${FEATURED.read?'':`<span class="pill pill-red" style="position:absolute;top:14px;right:14px;font-size:10px;">${tk('briefs.unread')}</span>`}
      </div>
      <div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <span class="pill pill-red">${tk('briefs.weeklyNo')} ${FEATURED.n}</span>
          <span class="pill">${tk(FEATURED.topicK)}</span>
        </div>
        <h2 class="headline" style="font-size:34px;margin:0 0 10px;line-height:1.2;">${tk('briefs.featured.title')}</h2>
        <div class="kicker" style="font-style:italic;font-family:var(--font-serif);font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink-secondary);margin-bottom:14px;">${tk('briefs.featured.subtitle')}</div>
        <div style="display:flex;gap:18px;align-items:center;margin-bottom:18px;">
          <div><div class="font-serif" style="font-size:22px;font-weight:600;">${FEATURED.claims}</div><div class="kicker" style="font-size:9px;">${tk('briefs.lbl.claims')}</div></div>
          <div><div class="font-serif" style="font-size:22px;font-weight:600;">${FEATURED.evidence}</div><div class="kicker" style="font-size:9px;">${tk('briefs.lbl.evidence')}</div></div>
          <div><div class="font-serif" style="font-size:22px;font-weight:600;">${tk('briefs.featured.dateSplit')}</div><div class="kicker" style="font-size:9px;">${tk('briefs.delivered')}</div></div>
        </div>
        <button class="btn btn-red">${tk('briefs.btn.read')}</button>
      </div>
    </a>
  </div>
</section>

<section>
  <div style="max-width:1280px;margin:0 auto;padding:42px 48px 64px;">
    <div class="kicker-red" style="margin-bottom:18px;">${tk('briefs.archive')}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;">
      ${BRIEFS.map(b=>`
        <a href="brief.html?id=${b.n}" class="paper-card" style="display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden;">
          <div style="position:relative;aspect-ratio:16/9;border-bottom:1px solid var(--divider);overflow:hidden;">
            <img src="assets/img/${b.img}" alt="" style="width:100%;height:100%;object-fit:cover;"/>
            <span class="watermark-number" style="position:absolute;top:-12px;right:6px;font-size:70px;">${b.n}</span>
          </div>
          <div style="padding:16px 18px;flex:1;display:flex;flex-direction:column;">
            <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
              <span class="pill" style="font-size:9px;">${tk('briefs.'+b.k+'.tag')}</span>
              <span class="pill" style="font-size:9px;">${tk(b.topicK)}</span>
            </div>
            <div class="font-serif" style="font-size:17px;font-weight:600;line-height:1.3;margin-bottom:10px;flex:1;">${tk('briefs.'+b.k+'.title')}</div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px dotted var(--divider-strong);padding-top:10px;">
              <span class="kicker">${tk(b.dateK)}</span>
              <span class="font-mono" style="font-size:11px;color:var(--ink-secondary);">${b.len} · ${b.claims}${tk('briefs.lbl.claimsLower')}</span>
            </div>
          </div>
        </a>
      `).join("")}
    </div>

    <div style="text-align:center;margin-top:32px;">
      <button class="btn btn-ghost" onclick="alert(tk('briefs.alert.loadMore'))">${tk('briefs.btn.loadMore')}</button>
    </div>
  </div>
</section>
`;
}

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
