<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings — 研迹 ResearchTrace</title>
<script src="js/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="settings">
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script>
RT.mountShell({ activeId: "settings", crumbKey: "settings.crumb", crumb: RTI18n.t("settings.crumb") });
RT.autoApplyI18n();

const tk = window.tk;

const SECTIONS = [
  ["profile",  "settings.nav.profile"],
  ["delivery", "settings.nav.delivery"],
  ["agents",   "settings.nav.agents"],
  ["sources",  "settings.nav.sources"],
  ["plan",     "settings.nav.plan"],
  ["data",     "settings.nav.data"],
];

function render() {
  document.getElementById("main").innerHTML = `
<section style="border-bottom:1px solid var(--divider);">
  <div style="max-width:1180px;margin:0 auto;padding:36px 48px 22px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;">
      <div>
        <div class="kicker-red" style="margin-bottom:10px;">${tk("settings.kicker")}</div>
        <h1 class="headline" style="font-size:42px;margin:0;">${tk("settings.title")}</h1>
        <p class="font-serif" style="font-style:italic;color:var(--ink-secondary);margin:6px 0 0;">${tk("settings.lede")}</p>
      </div>
      <div class="watermark-number" style="font-size:88px;opacity:.85;">06</div>
    </div>
  </div>
</section>

<section>
  <div style="max-width:1180px;margin:0 auto;padding:32px 48px 64px;display:grid;grid-template-columns:220px 1fr;gap:48px;">

    <!-- Settings nav -->
    <aside style="position:sticky;top:88px;align-self:start;">
      ${SECTIONS.map(([id,labelK],i)=>`
        <a href="#${id}" class="leader" style="text-decoration:none;color:${i===0?'var(--accent-red)':'var(--ink-secondary)'};padding:6px 0;display:flex;align-items:baseline;gap:6px;">
          <span class="font-mono" style="font-size:10px;">0${i+1}</span>
          <span class="font-serif" style="font-size:14px;">${tk(labelK)}</span>
        </a>
      `).join("")}
      <button class="btn btn-ghost" style="margin-top:24px;width:100%;justify-content:center;font-size:10px;" onclick="if(confirm(window.tk('common.confirmLogout'))) window.location.href='index.html'">${tk("settings.btn.logout")}</button>
    </aside>

    <div>

      <!-- Profile -->
      <section id="profile" style="margin-bottom:48px;">
        <div class="rule-kicker"><span class="kicker-red">${tk("settings.profile.kicker")}</span></div>
        <div style="display:grid;grid-template-columns:140px 1fr;gap:32px;">
          <div style="text-align:center;">
            <img src="assets/img/avatar.png" alt="" style="width:120px;height:120px;border-radius:50%;border:1px solid var(--divider);object-fit:cover;background:var(--bg-paper-warm);"/>
            <button class="pill" style="margin-top:10px;font-size:9px;" onclick="alert(window.tk('settings.profile.alert'))">${tk("settings.profile.change")}</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            ${[
              ["settings.profile.k1","settings.profile.v1"],
              ["settings.profile.k2","settings.profile.v2"],
              ["settings.profile.k3","settings.profile.v3"],
              ["settings.profile.k4","settings.profile.v4"],
              ["settings.profile.k5","settings.profile.v5"],
              ["settings.profile.k6","settings.profile.v6"],
            ].map(([kK,vK])=>`
              <div>
                <div class="kicker" style="font-size:9px;margin-bottom:4px;">${tk(kK)}</div>
                <div style="font-family:var(--font-serif);font-size:15px;padding:8px 12px;border:1px solid var(--divider);background:var(--bg-card);">${tk(vK)}</div>
              </div>
            `).join("")}
          </div>
        </div>
      </section>

      <!-- Delivery -->
      <section id="delivery" style="margin-bottom:48px;">
        <div class="rule-kicker"><span class="kicker-red">${tk("settings.delivery.kicker")}</span></div>

        <div style="margin-bottom:18px;">
          <div class="kicker" style="margin-bottom:10px;">${tk("settings.delivery.cadence")}</div>
          ${[
            ["settings.delivery.r1.k","settings.delivery.r1.v",true],
            ["settings.delivery.r2.k","settings.delivery.r2.v",true],
            ["settings.delivery.r3.k","settings.delivery.r3.v",true],
            ["settings.delivery.r4.k","settings.delivery.r4.v",true],
            ["settings.delivery.r5.k","settings.delivery.r5.v",false],
          ].map(([kK,vK,on])=>`
            <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dotted var(--divider);">
              <div style="flex:1;">
                <div class="font-serif" style="font-size:15px;font-weight:500;">${tk(kK)}</div>
                <div class="font-mono" style="font-size:11px;color:var(--ink-secondary);margin-top:2px;">${tk(vK)}</div>
              </div>
              <button onclick="toggle(this)" data-on="${on}" style="width:42px;height:22px;border-radius:11px;background:${on?'var(--accent-red)':'var(--divider-strong)'};border:none;position:relative;cursor:pointer;transition:all .2s;">
                <span style="position:absolute;top:2px;left:${on?'22px':'2px'};width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;"></span>
              </button>
            </div>
          `).join("")}
        </div>

        <div>
          <div class="kicker" style="margin-bottom:10px;">${tk("settings.delivery.channels")}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="pill is-active">${tk("settings.delivery.ch.app")}</button>
            <button class="pill is-active">${tk("settings.delivery.ch.email")}</button>
            <button class="pill">${tk("settings.delivery.ch.rss")}</button>
            <button class="pill">${tk("settings.delivery.ch.wechat")}</button>
            <button class="pill">${tk("settings.delivery.ch.slack")}</button>
            <button class="pill">${tk("settings.delivery.ch.tg")}</button>
          </div>
        </div>
      </section>

      <!-- Agents -->
      <section id="agents" style="margin-bottom:48px;">
        <div class="rule-kicker"><span class="kicker-red">${tk("settings.agents.kicker")}</span></div>
        <p class="font-serif" style="font-style:italic;color:var(--ink-secondary);font-size:14px;margin:0 0 18px;">${tk("settings.agents.lede")}</p>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;">
          ${[
            {n:"Ingestor", zhK:"settings.agents.a1.zh", dK:"settings.agents.a1.d", lastK:"settings.agents.a1.last", calls:"127/today"},
            {n:"Curator",  zhK:"settings.agents.a2.zh", dK:"settings.agents.a2.d", lastK:"settings.agents.a2.last", calls:"38/today"},
            {n:"Retriever",zhK:"settings.agents.a3.zh", dK:"settings.agents.a3.d", lastK:"settings.agents.a3.last", calls:"412/today"},
            {n:"Radar",    zhK:"settings.agents.a4.zh", dK:"settings.agents.a4.d", lastK:"settings.agents.a4.last", calls:"9 sources"},
            {n:"Reporter", zhK:"settings.agents.a5.zh", dK:"settings.agents.a5.d", lastK:"settings.agents.a5.last", calls:"3 briefs"},
          ].map(a=>`
            <div class="paper-card clickable" onclick="alert(window.tk('settings.agents.alertPrefix') + '${a.n}' + window.tk('settings.agents.alertSuffix'))" style="padding:14px;text-align:center;">
              <div class="font-serif" style="font-size:15px;font-weight:600;">${a.n}</div>
              <div class="kicker" style="font-style:italic;font-family:var(--font-serif);font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink-secondary);margin:2px 0 8px;">${tk(a.zhK)}</div>
              <div class="font-serif" style="font-size:12px;color:var(--ink-secondary);margin-bottom:8px;line-height:1.3;">${tk(a.dK)}</div>
              <div class="kicker-red" style="font-size:9px;">${tk("settings.agents.last")}${tk(a.lastK)}</div>
              <div class="font-mono" style="font-size:10px;color:var(--ink-tertiary);margin-top:2px;">${a.calls}</div>
            </div>
          `).join("")}
        </div>

        <div style="margin-top:22px;">
          <div class="kicker" style="margin-bottom:10px;">${tk("settings.agents.routing")}</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
            ${[
              ["settings.agents.r1.k","Claude 3.5 Sonnet"],
              ["settings.agents.r2.k","GPT-4o-mini"],
              ["settings.agents.r3.k","Gemini 2.5 Pro"],
            ].map(([kK,v])=>`
              <div class="paper-card" style="padding:12px 14px;">
                <div class="kicker" style="font-size:9px;">${tk(kK)}</div>
                <div class="font-mono" style="font-size:13px;font-weight:500;margin-top:4px;">${v}</div>
                <button class="pill" style="margin-top:8px;font-size:9px;" onclick="alert(window.tk('settings.agents.routeChange'))">${tk("settings.profile.change")}</button>
              </div>
            `).join("")}
          </div>
        </div>
      </section>

      <!-- Plan -->
      <section id="plan" style="margin-bottom:48px;">
        <div class="rule-kicker"><span class="kicker-red">${tk("settings.plan.kicker")}</span></div>
        <div class="paper-card is-feature" style="padding:24px 28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;">
          <div>
            <span class="pill pill-red" style="margin-bottom:8px;">${tk("settings.plan.current")}</span>
            <div class="font-serif" style="font-size:24px;font-weight:600;margin-top:6px;">${tk("settings.plan.price")}</div>
            <div class="font-serif" style="font-style:italic;color:var(--ink-secondary);font-size:13px;margin-top:4px;">${tk("settings.plan.next")}</div>
          </div>
          <div style="text-align:right;">
            <button class="btn btn-ghost" onclick="window.location.href='pricing.html'">${tk("settings.plan.btn.change")}</button>
            <button class="pill" style="margin-top:8px;font-size:9px;" onclick="alert(window.tk('settings.plan.alert.pause'))">${tk("settings.plan.btn.pause")}</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;">
          ${[["VAULT","2,438 / ∞"],["AGENT CALLS","580 / 5,000 today"],["TOPICS","12 / ∞"],["DEEP DIVES","6 / 20 monthly"]].map(([k,v])=>`
            <div style="padding:12px 14px;background:var(--bg-paper-warm);">
              <div class="kicker" style="font-size:9px;">${k}</div>
              <div class="font-mono" style="font-size:13px;margin-top:4px;">${v}</div>
            </div>`).join("")}
        </div>
      </section>

      <!-- Data -->
      <section id="data">
        <div class="rule-kicker"><span class="kicker-red">${tk("settings.data.kicker")}</span></div>
        <p class="font-serif" style="font-style:italic;color:var(--ink-secondary);font-size:14px;margin:0 0 14px;">${tk("settings.data.lede")}</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          ${[
            ["settings.data.r1.k","settings.data.r1.d","settings.data.r1.cta",false],
            ["settings.data.r2.k","settings.data.r2.d","settings.data.r2.cta",true ],
            ["settings.data.r3.k","settings.data.r3.d","settings.data.r3.cta",false],
            ["settings.data.r4.k","settings.data.r4.d","settings.data.r4.cta",false],
          ].map(([kK,dK,ctaK,danger])=>`
            <article class="paper-card" style="padding:16px 18px;">
              <div class="font-serif" style="font-size:15px;font-weight:600;">${tk(kK)}</div>
              <div class="font-serif" style="font-size:13px;font-style:italic;color:var(--ink-secondary);margin:4px 0 10px;">${tk(dK)}</div>
              <button class="${danger?'pill pill-red':'pill'}" style="font-size:10px;" onclick="alert(window.tk('${ctaK}') + window.tk('settings.data.alertSuffix'))">${tk(ctaK)} →</button>
            </article>
          `).join("")}
        </div>
      </section>
    </div>
  </div>
</section>
`;
}

function toggle(btn){
  const on = btn.dataset.on === 'true';
  btn.dataset.on = (!on).toString();
  btn.style.background = on ? 'var(--divider-strong)' : 'var(--accent-red)';
  btn.querySelector('span').style.left = on ? '2px' : '22px';
}

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
