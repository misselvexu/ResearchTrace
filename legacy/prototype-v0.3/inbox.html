<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox — 研迹 ResearchTrace</title>
<script src="js/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="inbox">
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script>
RT.mountShell({ activeId: "inbox", crumbKey: "inbox.crumb", crumb: RTI18n.t("inbox.crumb") });
RT.autoApplyI18n();

const ITEMS = [
  {n:"47", k:"1",  type:"PDF",     srcK:"inbox.src.dragged",   timeK:"inbox.t.0911", status:"PARSING",      topicK:"inbox.topic.long",    size:"2.4 MB", pages:"24p",    new:true,  topicId:"llm-longctx"},
  {n:"46", k:"2",  type:"URL",     srcK:"inbox.src.chromeExt", timeK:"inbox.t.0908", status:"INDEXED",      topicK:"inbox.topic.long",    size:"—",      pagesK:"inbox.size.web",        new:true,  topicId:"llm-longctx"},
  {n:"45", k:"3",  type:"TWITTER", srcK:"inbox.src.x",         timeK:"inbox.t.0852", status:"INDEXED",      topicK:"inbox.topic.long",    size:"—",      pagesK:"inbox.size.thread",     new:true,  topicId:"llm-longctx"},
  {n:"44", k:"4",  type:"YOUTUBE", srcK:"inbox.src.youtube",   timeK:"inbox.t.0830", status:"TRANSCRIBING", topicK:"inbox.topic.long",    size:"92 min", pagesK:"inbox.size.video",                topicId:"llm-longctx"},
  {n:"43", k:"5",  type:"EMAIL",   srcK:"inbox.src.fwdEmail",  timeK:"inbox.t.0814", status:"INDEXED",      topicK:"inbox.topic.long",    size:"—",      pagesK:"inbox.size.newsletter",            topicId:"llm-longctx"},
  {n:"42", k:"6",  type:"PDF",     srcK:"inbox.src.emailFwd",  timeK:"inbox.t.yesterday2214", status:"INDEXED", topicK:"inbox.topic.rag",  size:"3.1 MB", pages:"31p",                              topicId:"rag"},
  {n:"41", k:"7",  type:"URL",     srcK:"inbox.src.chromeExt", timeK:"inbox.t.yesterday1902", status:"INDEXED", topicK:"inbox.topic.pm",   size:"—",      pagesK:"inbox.size.longread",              topicId:"pm"},
  {n:"40", k:"8",  type:"NOTION",  srcK:"inbox.src.notion",    timeK:"inbox.t.yesterday1400", status:"INDEXED", topicK:"inbox.topic.long", size:"—",      pages:"6", pagesSuffixK:"inbox.size.notes", topicId:"llm-longctx"},
  {n:"39", k:"9",  type:"PDF",     srcK:"inbox.src.dragged",   timeK:"inbox.t.may7",          status:"INDEXED", topicK:"inbox.topic.eval", size:"5.8 MB", pages:"54p",                              topicId:"eval"},
  {n:"38", k:"10", type:"URL",     srcK:"inbox.src.chromeExt", timeK:"inbox.t.may7",          status:"INDEXED", topicK:"inbox.topic.agentic", size:"—",   pagesK:"inbox.size.web",                  topicId:"agentic"},
];

const TYPE_COLOR = { PDF:"var(--accent-red)", URL:"var(--info-blue)", TWITTER:"var(--ink-primary)", YOUTUBE:"var(--accent-red-deep)", EMAIL:"var(--warning-amber)", NOTION:"var(--success-green)" };

function render(){
  document.getElementById("main").innerHTML = `
<section style="border-bottom:1px solid var(--divider);">
  <div style="max-width:1280px;margin:0 auto;padding:32px 48px 22px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;">
      <div>
        <div class="kicker-red" style="margin-bottom:10px;">${tk('inbox.kicker')}</div>
        <h1 class="headline" style="font-size:44px;margin:0;">${tk('inbox.title')}</h1>
        <p class="font-serif" style="font-style:italic;color:var(--ink-secondary);margin:6px 0 0;">${tk('inbox.lede.html')}</p>
      </div>
      <div style="text-align:right;">
        <div class="watermark-number" style="font-size:96px;">47</div>
      </div>
    </div>

    <div onclick="alert(tk('inbox.alert.openPicker'))" class="clickable" style="margin-top:24px;border:2px dashed var(--divider-strong);background:var(--bg-paper-warm);padding:24px;display:flex;align-items:center;gap:24px;">
      <div style="font-family:var(--font-serif);font-size:42px;font-weight:700;color:var(--accent-red);">+</div>
      <div style="flex:1">
        <div class="font-serif" style="font-size:18px;font-weight:600;">${tk('inbox.dropzone.title')}</div>
        <div class="font-serif" style="font-style:italic;font-size:13.5px;color:var(--ink-secondary);margin-top:2px;">${tk('inbox.dropzone.sub')}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="pill" onclick="event.stopPropagation();alert(tk('inbox.alert.copyEmail'))">${tk('inbox.btn.emailFwd')}</button>
        <button class="pill" onclick="event.stopPropagation();alert(tk('inbox.alert.installExt'))">${tk('inbox.btn.installExt')}</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--divider);">
      ${[
        ["inbox.stat.parsing",1,"var(--warning-amber)"],
        ["inbox.stat.transcribing",1,"var(--warning-amber)"],
        ["inbox.stat.indexed",45,"var(--success-green)"],
        ["inbox.stat.failed",0,"var(--ink-tertiary)"],
        ["inbox.stat.newSince",3,"var(--accent-red)"],
      ].map(([lk,n,c])=>`
        <div>
          <div class="font-serif" style="font-size:24px;font-weight:600;color:${c};line-height:1;">${n}</div>
          <div class="kicker" style="font-size:10px;margin-top:2px;">${tk(lk)}</div>
        </div>`).join("")}
    </div>

    <div style="display:flex;align-items:center;gap:6px;margin-top:18px;flex-wrap:wrap;">
      <span class="kicker">${tk('inbox.filter')}</span>
      <button class="pill is-active">${tk('inbox.f.all')}</button>
      <button class="pill">${tk('inbox.f.pdf')}</button>
      <button class="pill">${tk('inbox.f.url')}</button>
      <button class="pill">${tk('inbox.f.twitter')}</button>
      <button class="pill">${tk('inbox.f.youtube')}</button>
      <button class="pill">${tk('inbox.f.email')}</button>
      <button class="pill">${tk('inbox.f.notion')}</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="alert(tk('inbox.alert.bulkClassify'))">${tk('inbox.btn.bulkClassify')}</button>
    </div>
  </div>
</section>

<section>
  <div style="max-width:1280px;margin:0 auto;padding:24px 48px 64px;">
    ${ITEMS.map(it=>{
      const title  = tk('inbox.it.'+it.k+'.title');
      const source = tk(it.srcK) + tk(it.timeK);
      const topic  = tk(it.topicK);
      const pages  = it.pagesK ? tk(it.pagesK) : (it.pagesSuffixK ? (it.pages + tk(it.pagesSuffixK)) : it.pages);
      return `
      <article class="paper-card clickable" style="padding:16px 20px;margin-bottom:8px;display:grid;grid-template-columns:50px 70px 1fr 200px 110px 120px 80px;gap:16px;align-items:center;" onclick="openItem('${it.n}')">
        <div class="font-serif" style="font-size:24px;font-weight:700;color:var(--accent-red);line-height:1;">${it.n}</div>
        <span class="pill" style="background:${TYPE_COLOR[it.type]};color:#fff;border-color:${TYPE_COLOR[it.type]};font-size:9px;justify-self:start;">${it.type}</span>
        <div style="min-width:0;">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:2px;">
            <div class="font-serif" style="font-size:15.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${title}</div>
            ${it.new?'<span class="pill pill-red" style="font-size:8px;padding:1px 5px;">NEW</span>':''}
          </div>
          <div class="kicker" style="font-style:italic;font-family:var(--font-serif);font-size:12px;text-transform:none;letter-spacing:0;">${source}</div>
        </div>
        <a href="topic.html?t=${it.topicId}" class="pill" style="justify-self:start;font-size:10px;" onclick="event.stopPropagation()">${topic}</a>
        <div class="kicker">${it.size} · ${pages}</div>
        <div>
          <span class="pill" style="font-size:9px;color:${it.status==='INDEXED'?'var(--success-green)':it.status==='PARSING'||it.status==='TRANSCRIBING'?'var(--warning-amber)':'var(--ink-tertiary)'};border-color:currentColor;">
            ${it.status==='PARSING'||it.status==='TRANSCRIBING'?'⚙ ':''}${it.status}
          </span>
        </div>
        <div style="display:flex;gap:4px;">
          <button class="pill" style="font-size:9px;padding:1px 6px;" onclick="event.stopPropagation();alert(tk('inbox.alert.openCard'))">${tk('inbox.btn.card')}</button>
          <button class="pill" style="font-size:9px;padding:1px 6px;" onclick="event.stopPropagation();window.location.href='ask.html?q=${encodeURIComponent(tk('inbox.askPrefix')+title)}'">${tk('inbox.btn.ask')}</button>
        </div>
      </article>`;
    }).join("")}

    <div style="text-align:center;margin-top:22px;">
      <button class="btn btn-ghost" onclick="alert(tk('inbox.alert.loadMore'))">${tk('inbox.btn.loadMore')}</button>
    </div>
  </div>
</section>
`;
}

function openItem(n){
  alert(tk('inbox.alert.openItem') + n + tk('inbox.alert.openItemTail'));
}

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
