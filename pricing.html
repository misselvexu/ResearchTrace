<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pricing — 研迹 ResearchTrace</title>
<script src="js/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="pricing">
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script>
RT.mountShell({ activeId: "pricing", crumbKey: "pricing.crumb", crumb: RTI18n.t("pricing.crumb") });
RT.autoApplyI18n();

const tk = window.tk;

const PLANS = [
  { tier:"01", nameK:"pricing.p1.name", zhK:"pricing.p1.zh", price:"$0",   periodK:"pricing.p1.period", color:"var(--ink-primary)",
    pitchK:"pricing.p1.pitch", current:false,
    features:[
      ["pricing.feat.topics",   "pricing.v.p1.topics"],
      ["pricing.feat.vault",    "pricing.v.p1.vault"],
      ["pricing.feat.calls",    "pricing.v.p1.calls"],
      ["pricing.feat.briefs",   "pricing.v.p1.briefs"],
      ["pricing.feat.channel",  "pricing.v.p1.channel"],
      ["pricing.feat.routing",  "pricing.v.p1.routing"],
      ["pricing.feat.evidence", "pricing.v.p1.evidence"],
      ["pricing.feat.export",   "pricing.v.p1.export"],
    ]},
  { tier:"02", nameK:"pricing.p2.name", zhK:"pricing.p2.zh", price:"$15",  periodK:"pricing.p2.period", color:"var(--ink-primary)",
    pitchK:"pricing.p2.pitch", current:false,
    features:[
      ["pricing.feat.topics",   "pricing.v.p2.topics"],
      ["pricing.feat.vault",    "pricing.v.p2.vault"],
      ["pricing.feat.calls",    "pricing.v.p2.calls"],
      ["pricing.feat.briefs",   "pricing.v.p2.briefs"],
      ["pricing.feat.channel",  "pricing.v.p2.channel"],
      ["pricing.feat.routing",  "pricing.v.p2.routing"],
      ["pricing.feat.sync",     "pricing.v.p2.sync"],
      ["pricing.feat.fwd",      "pricing.v.p2.fwd"],
    ]},
  { tier:"03", nameK:"pricing.p3.name", zhK:"pricing.p3.zh", price:"$29",  periodK:"pricing.p3.period", color:"var(--accent-red)", current:true, highlight:true,
    pitchK:"pricing.p3.pitch",
    features:[
      ["pricing.feat.topics",   "pricing.v.p3.topics"],
      ["pricing.feat.vault",    "pricing.v.p3.vault"],
      ["pricing.feat.calls",    "pricing.v.p3.calls"],
      ["pricing.feat.briefs",   "pricing.v.p3.briefs"],
      ["pricing.feat.channel",  "pricing.v.p3.channel"],
      ["pricing.feat.routing",  "pricing.v.p3.routing"],
      ["pricing.feat.e2ee",     "pricing.v.p3.e2ee"],
      ["pricing.feat.priority", "pricing.v.p3.priority"],
    ]},
  { tier:"04", nameK:"pricing.p4.name", zhK:"pricing.p4.zh", price:"$99",  periodK:"pricing.p4.period", color:"var(--ink-primary)", current:false,
    pitchK:"pricing.p4.pitch",
    features:[
      ["pricing.feat.seats",    "pricing.v.p4.seats"],
      ["pricing.feat.shared",   "pricing.v.p4.shared"],
      ["pricing.feat.sharedT",  "pricing.v.p4.sharedT"],
      ["pricing.feat.sharedB",  "pricing.v.p4.sharedB"],
      ["pricing.feat.admin",    "pricing.v.p4.admin"],
      ["pricing.feat.routing",  "pricing.v.p4.routing"],
      ["pricing.feat.private",  "pricing.v.p4.private"],
      ["pricing.feat.cs",       "pricing.v.p4.cs"],
    ]},
];

const FAQS = [
  ["pricing.faq.q1","pricing.faq.a1"],
  ["pricing.faq.q2","pricing.faq.a2"],
  ["pricing.faq.q3","pricing.faq.a3"],
  ["pricing.faq.q4","pricing.faq.a4"],
  ["pricing.faq.q5","pricing.faq.a5"],
  ["pricing.faq.q6","pricing.faq.a6"],
];

function render() {
  document.getElementById("main").innerHTML = `
<section style="border-bottom:1px solid var(--divider);">
  <div style="max-width:1280px;margin:0 auto;padding:48px 48px 28px;text-align:center;position:relative;">
    <div class="kicker-red" style="margin-bottom:14px;">${tk("pricing.kicker")}</div>
    <h1 class="headline" style="font-size:54px;margin:0 0 12px;">${tk("pricing.title")}</h1>
    <p class="font-serif" style="font-style:italic;font-size:18px;color:var(--ink-secondary);max-width:680px;margin:0 auto;">
      ${tk("pricing.lede")}
    </p>

    <div style="display:flex;justify-content:center;gap:8px;margin-top:24px;">
      <button class="pill is-active">${tk("pricing.monthly")}</button>
      <button class="pill" onclick="alert(window.tk('pricing.yearly.alert'))">${tk("pricing.yearly")}</button>
    </div>
  </div>
</section>

<section>
  <div style="max-width:1280px;margin:0 auto;padding:36px 48px 56px;">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:stretch;">
      ${PLANS.map(p=>`
        <article class="paper-card ${p.highlight?'is-feature':''}" style="padding:28px 24px;display:flex;flex-direction:column;position:relative;${p.highlight?'border:1.5px solid var(--accent-red);box-shadow:var(--shadow-lift);transform:translateY(-6px);':''}">
          ${p.highlight?`<span class="pill pill-red" style="position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--accent-red);color:#fff;border-color:var(--accent-red);">${tk("pricing.popular")}</span>`:''}
          ${p.current?`<span class="pill pill-solid" style="position:absolute;top:-13px;right:14px;font-size:9px;">${tk("pricing.your")}</span>`:''}
          <div class="watermark-number" style="font-size:48px;color:${p.color};opacity:.85;margin-bottom:8px;">${p.tier}</div>
          <div class="font-serif" style="font-size:24px;font-weight:600;">${tk(p.nameK)}</div>
          <div class="kicker" style="font-style:italic;font-family:var(--font-serif);font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-secondary);margin-bottom:14px;">${tk(p.zhK)}</div>

          <div style="display:flex;align-items:baseline;gap:6px;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);padding:14px 0;margin-bottom:16px;">
            <span class="font-serif" style="font-size:38px;font-weight:700;color:${p.color};letter-spacing:-.02em;">${p.price}</span>
            <span class="kicker" style="font-size:11px;">${tk(p.periodK)}</span>
          </div>

          <p class="font-serif" style="font-size:14px;font-style:italic;color:var(--ink-secondary);margin:0 0 18px;line-height:1.5;">${tk(p.pitchK)}</p>

          <div style="flex:1;margin-bottom:18px;">
            ${p.features.map(([kK,vK])=>`
              <div class="leader" style="padding:6px 0;">
                <span class="font-serif" style="font-size:13px;color:var(--ink-secondary);">${tk(kK)}</span>
                <span class="dots"></span>
                <span class="font-mono" style="font-size:11px;color:var(--ink-primary);font-weight:500;">${tk(vK)}</span>
              </div>
            `).join("")}
          </div>

          <button class="${p.current?'btn btn-ghost':'btn btn-red'}" onclick="${p.current?"alert(window.tk('pricing.alert.current'))":"alert(window.tk('pricing.alert.trial'))"}" style="width:100%;justify-content:center;">
            ${p.current?tk("pricing.btn.current"):p.tier==='01'?tk("pricing.btn.free"):p.tier==='04'?tk("pricing.btn.contact"):tk("pricing.btn.trial")}
          </button>
        </article>
      `).join("")}
    </div>

    <div style="margin-top:48px;padding:24px 28px;background:var(--bg-paper-warm);border:1px solid var(--divider);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;">
      <div>
        <div class="kicker-red" style="margin-bottom:8px;">${tk("pricing.eduTitle")}</div>
        <div class="font-serif" style="font-size:18px;font-weight:600;margin-bottom:4px;">${tk("pricing.eduBody")}</div>
        <div class="font-serif" style="font-style:italic;font-size:13.5px;color:var(--ink-secondary);">${tk("pricing.eduSub")}</div>
      </div>
      <button class="btn btn-ghost" onclick="alert(window.tk('pricing.eduCta.alert'))">${tk("pricing.eduCta")}</button>
    </div>

    <!-- FAQ -->
    <div style="margin-top:60px;">
      <div class="rule-kicker"><span class="kicker-red">${tk("pricing.faq")}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px 36px;">
        ${FAQS.map(([qK,aK])=>`
          <article>
            <div class="font-serif" style="font-size:16px;font-weight:600;margin-bottom:6px;">${tk(qK)}</div>
            <div class="font-serif" style="font-size:14.5px;line-height:1.65;color:var(--ink-secondary);">${tk(aK)}</div>
          </article>
        `).join("")}
      </div>
    </div>
  </div>
</section>
`;
}

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
