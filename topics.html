<!doctype html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Topics — 研迹 ResearchTrace</title>
<script src="js/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/tokens.css" />
</head>
<body data-page="topics">
<div id="app"></div>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script>
RT.mountShell({ activeId: "topics", crumbKey: "topics.crumb", crumb: RTI18n.t("topics.crumb") });
RT.autoApplyI18n();

const TOPIC_KEYS = [
  { id:"llm-longctx", k:"t1",  name:"LLM Long Context",       n:"01", img:"thumb-longctx.png",  items:147, claims:38, evidence:412, briefs:8, heat:5, status:"ACTIVE",   lastBriefK:"2hAgo",     pinned:true },
  { id:"agentic",     k:"t2",  name:"Agentic Workflows",      n:"02", img:"thumb-agentic.png",  items:89,  claims:24, evidence:213, briefs:5, heat:5, status:"ACTIVE",   lastBriefK:"today08",   pinned:true },
  { id:"eval",        k:"t3",  name:"AI Evaluation",          n:"03", img:"thumb-bench.png",    items:62,  claims:19, evidence:141, briefs:4, heat:4, status:"ACTIVE",   lastBriefK:"yesterday", pinned:true },
  { id:"rag",         k:"t4",  name:"RAG & Memory",           n:"04", img:"thumb-rag.png",      items:104, claims:31, evidence:298, briefs:6, heat:4, status:"ACTIVE",   lastBriefK:"today08",   pinned:true },
  { id:"pm",          k:"t5",  name:"AI Product Strategy",    n:"05", img:"thumb-strategy.png", items:78,  claims:22, evidence:167, briefs:7, heat:3, status:"ACTIVE",   lastBriefK:"3dAgo",     pinned:true },
  { id:"alignment",   k:"t6",  name:"Alignment & Safety",     n:"06", img:"thumb-align.png",    items:43,  claims:14, evidence:96,  briefs:3, heat:3, status:"WATCHING", lastBriefK:"5dAgo",     pinned:false },
  { id:"multi",       k:"t7",  name:"Multimodal & Vision",    n:"07", img:"thumb-strategy.png", items:36,  claims:11, evidence:78,  briefs:2, heat:3, status:"WATCHING", lastBriefK:"4dAgo",     pinned:false },
  { id:"infra",       k:"t8",  name:"AI Infrastructure",      n:"08", img:"thumb-rag.png",      items:51,  claims:15, evidence:122, briefs:4, heat:2, status:"WATCHING", lastBriefK:"7dAgo",     pinned:false },
  { id:"finetune",    k:"t9",  name:"Fine-tuning & Adaptation", n:"09", img:"thumb-longctx.png", items:29, claims:9,  evidence:64,  briefs:1, heat:2, status:"WATCHING", lastBriefK:"10dAgo",    pinned:false },
  { id:"opensrc",     k:"t10", name:"Open Source Models",     n:"10", img:"thumb-agentic.png",  items:67,  claims:18, evidence:154, briefs:5, heat:3, status:"ACTIVE",   lastBriefK:"yesterday", pinned:false },
  { id:"reasoning",   k:"t11", name:"Reasoning & Math",       n:"11", img:"thumb-bench.png",    items:48,  claims:16, evidence:112, briefs:3, heat:4, status:"ACTIVE",   lastBriefK:"2dAgo",     pinned:false },
  { id:"voice",       k:"t12", name:"Voice & Real-time AI",   n:"12", img:"thumb-strategy.png", items:24,  claims:7,  evidence:48,  briefs:1, heat:2, status:"PAUSED",   lastBriefK:"21dAgo",    pinned:false },
];

function statusKey(s) {
  if (s === "ACTIVE")   return "topics.statusActive";
  if (s === "WATCHING") return "topics.statusWatching";
  return "topics.statusPaused";
}

function render() {
  document.getElementById("main").innerHTML = `
<!-- Masthead -->
<section style="border-bottom:1px solid var(--divider);">
  <div style="max-width:1240px;margin:0 auto;padding:36px 48px 24px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;">
      <div>
        <div class="kicker-red" style="margin-bottom:12px;">${tk('topics.kicker')}</div>
        <h1 class="headline" style="font-size:48px;margin:0;">${tk('topics.title')}</h1>
        <p class="font-serif" style="font-style:italic;color:var(--ink-secondary);margin:8px 0 0;font-size:16px;max-width:720px;">
          ${tk('topics.lede.html')}
        </p>
      </div>
      <div style="text-align:right">
        <div class="watermark-number" style="font-size:96px;">02</div>
      </div>
    </div>

    <!-- Filter bar -->
    <div style="display:flex;align-items:center;gap:8px;margin-top:28px;flex-wrap:wrap;border-top:1px solid var(--divider);padding-top:18px;">
      <span class="kicker">${tk('topics.filter')}</span>
      <button class="pill is-active" onclick="filterTopics('all', this)">${tk('topics.f.all')}</button>
      <button class="pill" onclick="filterTopics('ACTIVE', this)">${tk('topics.f.active')}</button>
      <button class="pill" onclick="filterTopics('WATCHING', this)">${tk('topics.f.watching')}</button>
      <button class="pill" onclick="filterTopics('PAUSED', this)">${tk('topics.f.paused')}</button>
      <button class="pill" onclick="filterTopics('pinned', this)">${tk('topics.f.pinned')}</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="alert(tk('topics.alert.sortHeat'))">${tk('topics.sort')}</button>
      <button class="btn btn-red" onclick="alert(tk('topics.alert.newTopic'))">${tk('topics.new')}</button>
    </div>
  </div>
</section>

<!-- Topics grid -->
<section>
  <div style="max-width:1240px;margin:0 auto;padding:32px 48px 64px;">
    <div id="topicGrid" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:24px;">
      ${TOPIC_KEYS.map(t=>`
        <article data-status="${t.status}" data-pinned="${t.pinned}" class="paper-card clickable fade-up" style="overflow:hidden;display:flex;flex-direction:column;" onclick="window.location.href='topic.html?t=${t.id}'">
          <div style="position:relative;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--divider);">
            <img src="assets/img/${t.img}" alt="" style="width:100%;height:100%;object-fit:cover;"/>
            <span class="watermark-number" style="position:absolute;top:-10px;right:6px;font-size:64px;color:var(--accent-red);opacity:.92;text-shadow:1px 1px 0 rgba(255,255,255,.4)">${t.n}</span>
            ${t.pinned ? `<span class="pill pill-solid" style="position:absolute;top:10px;left:10px;font-size:9px;padding:2px 8px;">PINNED</span>` : ""}
          </div>
          <div style="padding:18px 20px;display:flex;flex-direction:column;flex:1;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <span class="kicker-red">${tk(statusKey(t.status))}</span>
              <span class="heat" title="HEAT">
                <div class="heat-bars">${Array.from({length:5},(_,i)=>`<div class="heat-bar ${i<t.heat?'on':''}"></div>`).join("")}</div>
              </span>
            </div>
            <h3 class="font-serif" style="font-size:21px;font-weight:600;margin:2px 0 4px;line-height:1.2;">${t.name}</h3>
            <div class="kicker" style="margin-bottom:10px;font-style:italic;font-family:var(--font-serif);font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-secondary);">${tk('topic.'+t.k+'.zh')}</div>
            <p class="font-serif" style="font-size:13.5px;line-height:1.55;color:var(--ink-secondary);margin:0 0 14px;flex:1;">${tk('topic.'+t.k+'.desc')}</p>

            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px dotted var(--divider-strong);padding-top:12px;margin-bottom:12px;">
              ${[["ITEMS",t.items],["CLAIMS",t.claims],["EVIDENCE",t.evidence],["BRIEFS",t.briefs]].map(([l,n])=>`
                <div>
                  <div class="font-serif" style="font-size:18px;font-weight:600;color:var(--ink-primary);">${n}</div>
                  <div class="kicker" style="font-size:9px;">${l}</div>
                </div>`).join("")}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="kicker">${tk('topics.lastBrief')}${tk('topics.lastBrief.'+t.lastBriefK)}</span>
              <span class="font-mono" style="font-size:11px;color:var(--accent-red);">${tk('topics.open')}</span>
            </div>
          </div>
        </article>
      `).join("")}
    </div>
  </div>
</section>
`;
}

function filterTopics(filter, btn) {
  document.querySelectorAll('.pill.is-active').forEach(p => p.classList.remove('is-active'));
  btn.classList.add('is-active');
  document.querySelectorAll('#topicGrid > article').forEach(a => {
    let show = true;
    if (filter === 'all') show = true;
    else if (filter === 'pinned') show = a.dataset.pinned === 'true';
    else show = a.dataset.status === filter;
    a.style.display = show ? '' : 'none';
  });
}

render();
document.addEventListener('rt:langchange', render);
</script>
</body>
</html>
